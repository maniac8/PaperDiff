version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/paperdiff"
    target-branch: "dev"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "npm"
    directory: "/paperdiff/frontend"
    target-branch: "dev"
    open-pull-requests-limit: 3
    schedule:
      interval: "weekly"
    groups:
      frontend-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    open-pull-requests-limit: 2
    schedule:
      interval: "weekly"
