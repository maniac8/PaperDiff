version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/paperdiff"
    target-branch: "dev"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directory: "/paperdiff/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
