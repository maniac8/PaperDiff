<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>对稿 · PaperDiff — 学术文稿阅读与版本比对</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)" />
    <style id="pd-boot-splash-style">
      #pd-boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f7f9;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif;
        transition: opacity 180ms ease;
      }
      html[data-theme='sepia'] #pd-boot-splash {
        background: #f6f1e7;
        color: #2c241b;
      }
      html[data-theme='dark'] #pd-boot-splash {
        background: #0d1117;
        color: #e6edf3;
      }
      #pd-boot-splash .pd-sp-card {
        text-align: center;
        padding: 24px 28px;
      }
      #pd-boot-splash .pd-sp-title {
        font-size: 16px;
        font-weight: 600;
        margin-top: 12px;
        letter-spacing: 0.02em;
      }
      #pd-boot-splash .pd-sp-sub {
        font-size: 12.5px;
        opacity: 0.65;
        margin-top: 6px;
      }
      #pd-boot-splash .pd-sp-bar {
        width: 168px;
        height: 3px;
        border-radius: 999px;
        background: rgba(148, 163, 184, 0.35);
        margin: 16px auto 0;
        overflow: hidden;
        position: relative;
      }
      #pd-boot-splash .pd-sp-bar::after {
        content: '';
        position: absolute;
        inset: 0 auto 0 0;
        width: 45%;
        border-radius: 999px;
        background: currentColor;
        animation: pd-sp-slide 1.1s ease-in-out infinite;
      }
      @keyframes pd-sp-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
    </style>
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('paperdiff_theme') || 'light';
          var resolved =
            pref === 'auto'
              ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : pref === 'sepia' || pref === 'dark'
                ? pref
                : 'light';
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved === 'dark' ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F6F7F9] text-slate-900 antialiased selection:bg-blue-100 selection:text-blue-900">
    <div id="pd-boot-splash" role="status" aria-live="polite">
      <div class="pd-sp-card">
        <svg width="42" height="42" viewBox="0 0 48 48" fill="none" style="margin:0 auto" aria-hidden="true">
          <rect x="4" y="6" width="18" height="36" rx="4" stroke="currentColor" stroke-width="2.6" />
          <rect x="26" y="6" width="18" height="36" rx="4" fill="currentColor" fill-opacity="0.12" stroke="currentColor" stroke-width="2.6" />
          <line x1="9" y1="16" x2="17" y2="16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <line x1="9" y1="23" x2="17" y2="23" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <line x1="31" y1="16" x2="39" y2="16" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
          <line x1="31" y1="23" x2="39" y2="23" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        </svg>
        <div class="pd-sp-title">对稿 · PaperDiff</div>
        <div class="pd-sp-sub">正在打开…</div>
        <div class="pd-sp-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
